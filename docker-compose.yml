services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: ratelimit, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rate-limit-service:
    build: { context: ., dockerfile: Dockerfile.rate }
    depends_on: [postgres, redis]
    ports: ["8081:8081"]
  api-service:
    build: { context: ., dockerfile: Dockerfile.api }
    depends_on: [rate-limit-service]
    ports: ["8082:8082"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
volumes: { pgdata: {} }
