global: { scrape_interval: 10s }
scrape_configs:
  - job_name: rate-limit-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['rate-limit-service:8081']}]
  - job_name: api-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['api-service:8082']}]
